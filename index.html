<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CrazyBurger</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>🍔 CrazyBurger</h1>
    <h2>O melhor hambúrguer da região! Unir e saborear!</h2>

    <h3>🔹 Comidas</h3>
         <!-- comando para adicionar as fotos ao lado do texto -->
    <div class="item-cardapio"> 

        <!-- div criado para nomear os lanches -->
        <div class="infos-lanche">
            <h4>Classic Burger</h4>
            
            <div class="texto-e-preco">
                <p class="descricao">Pão artesanal, carne de 150g, queijo prato derretido, alface, tomate e maionese da casa.</p>
                <p class="preco">R$ 28,00</p>
            </div>
        </div> <!-- 👈 MUDANÇA: O infos-lanche fecha exatamente AQUI, logo após o preço! -->

        <!-- A foto fica aqui, depois do bloco de textos e antes de fechar o item completo -->
        <img src="imagem/Captura de Tela (114).png" alt="Foto do Classic Burger" class="foto-lanche">

    </div> <!-- 👈 MUDANÇA: O item-cardapio fecha só AQUI no final de tudo! -->

    <h3>🔸 Bebidas</h3>
    <div class="item-bebidas">
        <h4>Cocoa-Cola</h4>
    </div>
</body>

</html>
